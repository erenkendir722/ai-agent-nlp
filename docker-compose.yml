# Tek komutla kurulum:  docker compose up -d
#
# İki servis: Ollama (çıkarım) + uygulama (Streamlit + API). Dışarıya hiçbir
# çağrı yapılmaz — modeller yerel diskte, veri yerel diskte.
#
# HAVA BOŞLUĞU (AIR-GAP) KANITI:
#   Ağ bağlantısını kesip `docker compose up -d` çalıştırın. Model bir kez
#   indirildikten sonra sistem internetsiz çalışır. `internal: true` ağı,
#   servislerin dışarıya çıkışını ALTYAPI DÜZEYİNDE engeller — bu bir vaat
#   değil, uygulanmış bir kısıttır.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: katilim-ollama
    volumes:
      - ollama-modelleri:/root/.ollama
    networks:
      - ic-ag
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_HOST: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  uygulama:
    build: .
    container_name: katilim-uygulama
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8501:8501"   # Streamlit
    volumes:
      - ./data:/uygulama/data
      - ./docs:/uygulama/docs
    networks:
      - ic-ag
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}"
      VERITABANI_URL: "sqlite:///data/katilim.db"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "1"
    restart: unless-stopped

  # REST API ayrı servis. Aynı imaj, farklı komut.
  # Tek konteynerde iki süreç çalıştırmak yerine ayırmak, kurum içi dağıtımda
  # arayüzü ve API'yi bağımsız ölçeklemeye izin verir; ayrıca biri çökerse
  # diğeri ayakta kalır. (Önceki sürümde 8000 portu yayınlanıyordu ama onu
  # dinleyen bir süreç yoktu — /docs boş dönüyordu.)
  api:
    build: .
    container_name: katilim-api
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - uvicorn
      - src.api.sunucu:uygulama
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "8000:8000"   # REST API
    volumes:
      - ./data:/uygulama/data
    networks:
      - ic-ag
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}"
      VERITABANI_URL: "sqlite:///data/katilim.db"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx;httpx.get('http://127.0.0.1:8000/docs',timeout=4).raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

networks:
  ic-ag:
    driver: bridge
    # NOT: Model ilk indirmesi için bu satır geçici olarak yorumlanır,
    # indirme bitince açılır. Air-gap demosunda AÇIK olmalıdır.
    # internal: true

volumes:
  ollama-modelleri:
