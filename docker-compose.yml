# Tek komutla kurulum:  docker compose up -d
#
# İki servis: Ollama (çıkarım) + uygulama (Streamlit + API). Varsayılan
# yapılandırmada çıkarım yereldir — modeller yerel diskte, veri yerel diskte.
#
# HAVA BOŞLUĞU (AIR-GAP) KANITI:
#   Ağ bağlantısını kesip `docker compose up -d` çalıştırın. Model bir kez
#   indirildikten sonra sistem internetsiz çalışır. `internal: true` ağı,
#   servislerin dışarıya çıkışını ALTYAPI DÜZEYİNDE engeller — bu bir vaat
#   değil, uygulanmış bir kısıttır.
#
# ⚠️ KAPSAMI TAM YAZIYORUZ — «hiçbir çağrı yapılmaz» demek bugün YANLIŞ olur:
#
#   ✅ Kural katmanı, normalizasyon, karşılaştırma, muhakeme, chatbot'un
#      YAPISAL sorgu yolu ve `LLM_SAGLAYICI=ollama` ile çıkarım: kapalı devre.
#      Ölçümü `tests/test_sizinti_yok.py`.
#   ❌ Chatbot'un KOŞUL SORGUSU yolu: `src/vektor_db.gom()` sorgu ANINDA EVREN
#      gömme ucuna çıkar ve yerel yedeği YOKTUR. İnternetsiz demoda o yol
#      çalışmaz; kullanıcı «gömme servisine ulaşılamadı» mesajı alır (sessizce
#      yanlış cevap vermez — `chatbot._kosul_cevabi`).
#
#   Yani hava boşluğu iddiası ÇIKARIM ve KARŞILAŞTIRMA için geçerlidir,
#   RAG metin araması için değildir. Kapatmanın yolu yerel bir gömme
#   sağlayıcısıdır (ollama `bge-m3`, 1024 boyut — `vektor_db.BOYUT` ile uyar).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: katilim-ollama
    volumes:
      - ollama-modelleri:/root/.ollama
    networks:
      - ic-ag          # YALNIZ burada: model sunucusunun disariya rotasi YOK
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_HOST: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  uygulama:
    build: .
    container_name: katilim-uygulama
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8501:8501"   # Streamlit
    volumes:
      - ./data:/uygulama/data
      - ./docs:/uygulama/docs
    networks:
      - ic-ag          # ollama'ya erisim
      - sunum          # yalnizca 8501'in host'a yayinlanmasi icin
    environment:
      # SAĞLAYICI SEÇİMİ — SABİT `ollama`. İnterpolasyon KULLANILMIYOR.
      #
      # Bu satır olmadan `saglayici.SAGLAYICI_ADI` varsayılanı `evren` oluyordu
      # ve compose kendi kendisiyle çelişiyordu: yanı başında rotası kapalı bir
      # model sunucusu ayakta dururken uygulama dış HTTPS'e çıkmaya çalışıyor,
      # anahtar yoksa `EvrenSaglayici` daha kurulurken `RuntimeError` atıyordu.
      #
      # ⚠️ NEDEN `${LLM_SAGLAYICI:-ollama}` DEĞİL — ölçüldü (26 Ağu, `compose config`):
      #     Docker Compose interpolasyonu, varsayılana düşmeden ÖNCE proje
      #     kökündeki `.env` dosyasını okur. `.env` içinde `LLM_SAGLAYICI=evren`
      #     var (yerel `make extract` için DOĞRUSU o) ve compose onu alıp
      #     varsayılanı eziyordu:
      #
      #         uygulama: LLM_SAGLAYICI: evren      <- hava boşluğu sessizce bitti
      #         uygulama: EVREN_API_ANAHTARI: sk-…  <- sır konteynere sızdı
      #
      #     Yani "üzerine yazılabilir olsun" iyi niyeti, tam da engellemek
      #     istediğimiz hatayı geri getiriyordu. Aynı `.env`, iki tüketiciye
      #     (yerel venv ve Docker) zıt varsayılanlar borçlu; çakışmayı çözmenin
      #     tek dürüst yolu bu dosyada seçimi SABİTLEMEK.
      #
      # EVREN ile koşmanın yolu Docker DEĞİLDİR, yerel sanal ortamdır:
      #     make extract            (LLM_SAGLAYICI=.env'den okunur)
      # Bu dosya hava boşluğu kanıtıdır (E-07); iki işi birden yapmaya
      # çalışması zaten bu hatanın kaynağıydı.
      LLM_SAGLAYICI: "ollama"
      # EVREN_* DEĞİŞKENLERİ BİLEREK GEÇİRİLMİYOR: sağlayıcı yerel olduğu için
      # gereksizler ve bankacılık ortamına giden bir konteynerin ortamında
      # duran bir API anahtarı `docker inspect` ile okunabilir.
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}"
      VERITABANI_URL: "sqlite:///data/katilim.db"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "1"
    restart: unless-stopped

  # REST API ayrı servis. Aynı imaj, farklı komut.
  # Tek konteynerde iki süreç çalıştırmak yerine ayırmak, kurum içi dağıtımda
  # arayüzü ve API'yi bağımsız ölçeklemeye izin verir; ayrıca biri çökerse
  # diğeri ayakta kalır. (Önceki sürümde 8000 portu yayınlanıyordu ama onu
  # dinleyen bir süreç yoktu — /docs boş dönüyordu.)
  api:
    build: .
    container_name: katilim-api
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - uvicorn
      - src.api.sunucu:uygulama
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "8000:8000"   # REST API
    volumes:
      - ./data:/uygulama/data
    networks:
      - ic-ag          # ollama'ya erisim
      - sunum          # yalnizca 8000'in host'a yayinlanmasi icin
    environment:
      # `uygulama` ile AYNI seçim, aynı gerekçe (orada yazılı — interpolasyon
      # `.env`'i okuduğu için sabitlendi). İki serviste birden olmak zorunda:
      # `/extract` ucu çıkarım hattını çağırıyor, yani API de sağlayıcı seçer.
      # Yalnız birine koymak, arayüz yereldeyken API'nin dışarı çıktığı bir
      # yarım hava boşluğu üretirdi.
      LLM_SAGLAYICI: "ollama"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}"
      VERITABANI_URL: "sqlite:///data/katilim.db"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx;httpx.get('http://127.0.0.1:8000/docs',timeout=4).raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

networks:
  # ---------------------------------------------------------------------
  # HAVA BOŞLUĞU — E-07, 18 Ağustos 2026'da ölçüldü
  #
  # `internal: true`, Docker'a bu ağ için dışarı çıkış (NAT) kuralı
  # KURMAMASINI söyler. Bir vaat değil, altyapı kısıtı: uygulama kodu
  # değiştirilse bile paket dışarı çıkamaz.
  #
  # ⚠️ ÖĞRENİLEN DERS — bunu tek ağ yapmayın:
  # `internal: true` olan bir ağda Docker `ports:` yayınını da DÜŞÜRÜR.
  # 18 Ağu'da tek ağla denendi: konteynerler sağlıklıydı, içeriden 200
  # dönüyorlardı, ama host'tan 8501 ve 8000 ERİŞİLEMEZ oldu. Jüri
  # demosunda bu ekranın kararması demekti.
  #
  # Çözüm iki ağ:
  #   ic-ag  (internal)  — ollama BURADA ve YALNIZ burada. Model
  #                        sunucusunun internete rotası fiziksel olarak yok.
  #   sunum  (bridge)    — yalnız 8501/8000'in host'a yayınlanması için.
  #                        uygulama ve api ikisinde birden.
  #
  # Uygulama katmanının dış çağrı yapmadığı ayrıca test edilir:
  # `tests/test_sizinti_yok.py` (6 test). Yani model tarafında altyapı
  # kısıtı, uygulama tarafında test kanıtı var.
  #
  # Tam kapalı gösterim için ayrıca host'un Wi-Fi'ını kapatın — o zaman
  # `sunum` ağının da gidecek yeri kalmaz (E-07 demo adımı).
  # ---------------------------------------------------------------------
  ic-ag:
    driver: bridge
    internal: true

  sunum:
    driver: bridge

volumes:
  ollama-modelleri:
