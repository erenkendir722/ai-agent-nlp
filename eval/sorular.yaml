# Kalkan ölçüm soru kümesi (bulgu 1.2)
#
# NEDEN SABİT DOSYA: "kalkanı düzelttik" bir iddiadır; iddia ölçülmeden
# yayınlanmaz. Bu küme `make eval` ile her koşuda çalışır ve yanlış blok
# oranı `docs/SONUCLAR.md`'ye yazılır. Elle seçilmiş birkaç soruyla
# "çalışıyor" demek, ölçmemekle aynı şeydir.
#
# `mesru` ALANI — soruyu insan işaretler, sistem değil:
#   true  : korpustan cevaplanabilir. Kalkan bunu ENGELLERSE yanlış bloktur.
#   false : kapsam dışı ya da veride karşılığı yok. Sistemin "bulunmuyor"
#           demesi DOĞRU davranıştır; bu bir blok değildir.
#
# Kalkan blokları `dogrulama_gecti=False` ile ölçülür. "Bu bilgi veri
# setinde bulunmuyor" cevabı blok DEĞİLDİR — kalkan değil, veri konuşur.

