# Katılım bankaları kayıt defteri — şartname 5.1
#
# KAYNAK: BDDK Kuruluş Listesi — https://www.bddk.org.tr/Kurulus/Liste/77
# YÖNTEM: Liste tarayıcıdan MANUEL alınmıştır (şartname "manuel veri toplama
#         teknikleri"ne izin veriyor). Ekran görüntüsü: docs/kanit/bddk-liste.png
#         24 Ağu 2026 ölçümü: toplayıcı bddk.org.tr'ye BAĞLANAMIYOR — TLS
#         sertifika zinciri doğrulanamıyor (unable to get local issuer
#         certificate). Tek seferlik tanı denemesinde (doğrulama kapatılarak)
#         /robots.txt HTTP 404 döndü, yani dosya yok; reddetme de yok.
#         Kanıt: docs/kanit/ROBOTS_KONTROL_GUNLUGU.md · docs/kanit/VERI_TOPLAMA_ETIGI.md
#         (Daha önce burada "robots.txt engelliyor" yazıyordu; ölçüm bunu
#          doğrulamadı. Karar aynı, gerekçesi düzeltildi.)
#
# ÖNEMLİ: Faaliyete geçmemiş bankalar da listede tutulur ve `durum` ile
# işaretlenir. Sitelerinde kampanya olmayacaktır; bu bir eksiklik değil,
# kayıt defterinin eksiksizliğidir (bkz. docs/VERI_METODOLOJISI.md).
#
# `kod_dogrulandi: false` olan satırlar Görkem tarafından BDDK/TBB kaynağından
# teyit edilmeli. Kod yalnız kimlik üretiminde kullanılır; yanlış olması
# çıkarımı bozmaz ama yayınlanan veri setinde hata olur.
#
# `seed_urls` = KAZIMANIN BAŞLADIĞI ADRESLER (26 Ağu 2026'dan beri).
#   Kazıyıcılar (`src/collector/kaziyicilar/`) başlangıç adreslerini buradan
#   okur; ayrıca `tools/robots_kanit.py` robots.txt kanıtını yine bu liste
#   üzerinden üretir. Yani burası fiilen çekilen adresleri göstermezse
#   şartname 5.1 kanıtı yanlış adresleri denetlemiş olur. Bir bankanın adresi
#   değişirse düzeltme Python dosyasına değil BURAYA yazılır.
#   Sınama: `tests/test_kaziyicilar.py`
#
# `url_desenleri` ARTIK KULLANILMIYOR. Kaldırılan jenerik httpx toplayıcısının
#   URL süzgeciydi; kazıyıcılar kampanya bağlantılarını CSS seçicisiyle
#   buluyor. Alan `src/schema.py` donmuş olduğu için silinmedi (ADR gerekir).

- kod: "0203"
  ad: "Albaraka Türk Katılım Bankası A.Ş."
  kisa_ad: "Albaraka Türk"
  site: "https://www.albaraka.com.tr"
  durum: "faal"
  kod_dogrulandi: true
  not: "JS lazy load. Kazıyıcı «daha fazla kampanya» butonuna kart sayısı artmayı bırakana dek basar."
  seed_urls:
    - "https://www.albaraka.com.tr/tr/kampanyalar"
  urun_bolumleri:
    - "https://www.albaraka.com.tr/tr/bireysel/finansmanlar"
    - "https://www.albaraka.com.tr/tr/kobi/finansmanlar"
  url_desenleri: ["/kampanya", "/finansman", "/kredi-karti", "/urun"]
  robots_kontrol: true

