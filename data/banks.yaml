# Katılım bankaları kayıt defteri — şartname 5.1
#
# KAYNAK: BDDK Kuruluş Listesi — https://www.bddk.org.tr/Kurulus/Liste/77
# YÖNTEM: BDDK sitesi robots.txt ile otomatik erişimi engellediği için liste
#         tarayıcıdan MANUEL alınmıştır (şartname "manuel veri toplama
#         teknikleri"ne izin veriyor). Ekran görüntüsü: docs/kanit/bddk-liste.png
#
# ÖNEMLİ: Faaliyete geçmemiş bankalar da listede tutulur ve `durum` ile
# işaretlenir. Sitelerinde kampanya olmayacaktır; bu bir eksiklik değil,
# kayıt defterinin eksiksizliğidir (bkz. docs/VERI_METODOLOJISI.md).
#
# `kod_dogrulandi: false` olan satırlar Görkem tarafından BDDK/TBB kaynağından
# teyit edilmeli. Kod yalnız kimlik üretiminde kullanılır; yanlış olması
# çıkarımı bozmaz ama yayınlanan veri setinde hata olur.

